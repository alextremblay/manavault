name: Container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' }}
          load: ${{ github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          pull: true
          no-cache-filters: runner
          tags: ${{ github.event_name == 'workflow_dispatch' && 'manavault:manual' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MANAVAULT_ASSET_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export downloadable image
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/container
          docker save manavault:manual | gzip -6 > dist/container/manavault-linux-amd64.tar.gz
          cd dist/container
          sha256sum manavault-linux-amd64.tar.gz > manavault-linux-amd64.tar.gz.sha256
          {
            echo '## Downloadable container image'
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo
            echo 'Download and extract the **manavault-linux-amd64** artifact from this run.'
            echo 'The image targets Linux amd64; Apple Silicon requires amd64 emulation.'
            echo
            echo '```sh'
            echo 'sha256sum -c manavault-linux-amd64.tar.gz.sha256'
            echo 'docker load -i manavault-linux-amd64.tar.gz'
            echo '```'
            echo
            echo 'Loaded image: `manavault:manual`. See `docs/self-hosting.md` for run configuration.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload container artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manavault-linux-amd64
          path: dist/container/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
